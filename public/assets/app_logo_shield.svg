<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Subtle drop shadow for the chain links to create depth against the shield -->
    <filter id="chain-shadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#001520" flood-opacity="0.35" />
    </filter>

    <!-- Clip path to perfectly interlock the chain links by redrawing only the top intersection -->
    <clipPath id="link-clip">
      <rect x="-40" y="-60" width="80" height="60" />
    </clipPath>
  </defs>

  <!-- 
    =========================================
    SHIELD BACKGROUND
    =========================================
  -->
  <g id="shield">
    <!-- Main Shield Base & Border -->
    <path 
      d="M 200 30 
         L 350 70 
         L 350 190 
         C 350 290, 275 350, 200 380 
         C 125 350, 50 290, 50 190 
         L 50 70 
         Z" 
      fill="#007CB3" 
      stroke="#005F8A" 
      stroke-width="20" 
      stroke-linejoin="round" 
    />
    
    <!-- Geometric Facet (Right Half) for a professional, premium flat look -->
    <path 
      d="M 200 30 
         L 350 70 
         L 350 190 
         C 350 290, 275 350, 200 380 
         Z" 
      fill="#000000" 
      fill-opacity="0.08" 
    />
  </g>

  <!-- 
    =========================================
    INTERLOCKING CHAIN LINKS
    =========================================
  -->
  <!-- Outer group applies the drop shadow straight down, independent of the rotation -->
  <g filter="url(#chain-shadow)">
    <!-- Inner group rotates and centers the chain assembly -->
    <g transform="translate(200, 195) rotate(-45)">
      
      <!-- Link 1 (Bottom-Left in rotated space) -->
      <rect 
        id="link1" 
        x="-90" 
        y="-32" 
        width="120" 
        height="64" 
        rx="32" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="20" 
      />
      
      <!-- Link 2 (Top-Right in rotated space) - Drawn over Link 1 -->
      <rect 
        id="link2" 
        x="-30" 
        y="-32" 
        width="120" 
        height="64" 
        rx="32" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="20" 
      />
      
      <!-- Redraw the top half of Link 1 to overlap Link 2, completing the interlock -->
      <use href="#link1" clip-path="url(#link-clip)" />
      
    </g>
  </g>
</svg>